<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <title>Masaru Suplementos | Loja Online</title>
  <link rel="stylesheet" href="./css/index.css">
</head>
<body>
  <header class="logo-titulo">
    <div class="titulo-pricipal">
      <h1 class="SITE-NOME">Masaru Suplementos</h1>
    </div>

    <div class="pesquisa-opcoes">
<input type="text" id="input-busca" placeholder="Buscar suplementos" class="input-busca">
    </div>

    <select class="selecionar-optcoes" name="opcao"
      id="opcao">
      <option value="" disabled selected hidden>Opções</option>
      <option value="Creatina" class="opcao" >Creatina</option>
      <option value="Whey" class="opcao">Whey</option>
      <option value="Pré-Treino" class="opcao" >Pré-Treino</option>
    </select>

    <!-- NOVO BLOCO: Favoritos e Carrinho -->
    <div class="bloco-acoes">
      <a href="#" class="icone-user" id="btn-favoritos" title="Favoritos">
        <img class="imag-banner" src="./imagms/silhueta-de-formato-simples-de-coracao.png" alt="coracao">
        <span class="text-icone">Favoritos</span>
        <span class="contador-favoritos">0</span>
      </a>

     <a href="#" class="icone-user" id="btn-carrinho" title="Carrinho de Compras">
  <img class="imag-banner" src="./imagms/carrinho-de-compras.png" alt="carrinho">
  <span class="text-icone">Carrinho</span>
  <span class="contador-carrinho">0</span>
</a>
    </div>
  </header>

  <main class="container-produtos" id="lista-produtos">
  </main>

  <aside id="painel-favoritos" class="painel-favoritos">
        <div class="cabecalho-painel">
            <h2>Meus Favoritos ❤️</h2>
            <button id="btn-fechar-favoritos" class="btn-fechar">&times;</button>
        </div>
        
        <div id="lista-favoritos-painel" class="conteudo-painel">
            <!-- Aqui o JavaScript vai desenhar os itens favoritados -->
        </div>
    </aside>

    <div id="overlay-favoritos" class="overlay-favoritos"></div>

  
  <!-- Botão no topo para abrir o carrinho -->
<button id="btn-carrinho" class="btn-topo">
  🛒 Carrinho <span class="contador-carrinho">0</span>
</button>

<!-- Overlay e Painel Lateral do Carrinho -->
<div id="overlay-carrinho" class="overlay"></div>
<div id="painel-carrinho" class="painel-lateral">
  <div class="painel-header">
    <h3>Seu Carrinho de Compras</h3>
    <button id="btn-fechar-carrinho" class="btn-fechar">❌</button>
  </div>

  <!-- Lista onde os produtos comprados vão aparecer -->
  <div id="lista-carrinho-painel" class="lista-painel">
    <!-- Os itens serão injetados aqui pelo JavaScript -->
  </div>

  <!-- Rodapé com o Total e Botão do WhatsApp -->
  <div class="painel-footer">
    <div class="total-container">
      <span>Total:</span>
      <span id="preco-total-carrinho">R$ 0,00</span>
    </div>
    <button id="btn-whatsapp" class="btn-whatsapp">Finalizar Pedido</button>
  </div>
</div>

    

  <footer class="footer-logo">
    <div class="footer-descricao">
      <h3>todos o direitos reservado</h3>
      <h2 class="marca">18/02/2026 Bruno da silva de oliveira</h2>
    </div>
  </footer>

  <script src="./js/index.js"></script>
</body>
</html>
